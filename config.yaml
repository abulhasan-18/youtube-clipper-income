# Clipper Automation Configuration

video:
  target_width: 1080
  target_height: 1920
  aspect_ratio: "9:16"
  min_clip_duration_sec: 25
  max_clip_duration_sec: 60
  target_fps: 30
  reframe_mode: "blur_bg"  # Options: blur_bg (100% face & content visible), split_screen, face_track

subtitles:
  enabled: true
  style: "hormozi"            # Options: hormozi (word-by-word bold highlight), clean, minimal
  max_words_per_line: 3
  font_name: "Arial Black"
  font_size: 44
  text_color: "#FFFFFF"
  highlight_color: "#FFE600"  # Vibrant Neon Yellow
  outline_color: "#000000"    # Thick Black Border
  outline_width: 6

publishing:
  target_daily_uploads: 200    # Daily upload target: 200 viral Shorts
  interval_minutes: 0          # Sequential uploads with no interval delay
  cooldown_seconds: 120        # 2 minute break after every publish
  default_visibility: "public" # public, unlisted, or private
  headless: false              # Runs visible in frontend browser window (user can watch on screen)
  upload_backend: "studio"     # studio (Playwright - no quota limits) or api (YouTube API v3)
  channel_tags:
    - "Shorts"
    - "viral"
    - "trending"
    - "fyp"

autopilot:
  enabled: true
  pipeline_mode: "concurrent"  # Option A: Simultaneous Concurrent Pipeline (Producer + Uploader in parallel)
  creators_registry: "creators.yaml"
  min_video_duration_minutes: 8
  max_video_duration_minutes: 240
  max_queue_buffer: 10         # Keeps up to 10 rendered clips on disk simultaneously (< 100MB)
  clips_per_stream: 6          # Extract 6 viral shorts per ingested stream

models:
  transcriber:
    provider: "groq"
    model: "whisper-large-v3"
  candidate_scanner:
    provider: "groq"
    model: "qwen/qwen3.8-27b"
  viral_judge:
    provider: "gemini"
    model: "gemini-3.6-flash"
  visual_verifier:
    provider: "gemini"
    model: "gemini-3.6-flash"
  copywriter:
    provider: "groq"
    model: "qwen/qwen3.8-27b"

paths:
  downloads: "downloads"
  output: "output"
  temp: "temp"
  database: "storage/clipper.db"
