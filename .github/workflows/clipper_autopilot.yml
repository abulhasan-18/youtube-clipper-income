name: Autonomous AI Video Clipper & YouTube Shorts Publisher

on:
  schedule:
    # Runs every 15 minutes (4 shorts/hour = 96 shorts/day 24/7)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  clip_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pillow opencv-python-headless
          playwright install chromium --with-deps

      - name: Restore SQLite Database & Clips Cache
        uses: actions/cache@v4
        with:
          path: |
            storage/clipper.db
            output/
          key: clipper-state-${{ github.run_id }}
          restore-keys: |
            clipper-state-

      - name: Run AutoPilot (Every 15 mins: Discover, Clip, Reframe, Publish)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          YOUTUBE_SESSION_B64: ${{ secrets.YOUTUBE_SESSION_B64 }}
        run: |
          # 1. Discover fresh video and produce viral shorts if queue is low
          python -c "
          from core.discovery import ContentDiscovery
          from pipeline import ClipperPipeline
          from storage.database import Database
          import os

          db = Database()
          queued = db.get_queued_clips(limit=50)
          valid_queued = [c for c in queued if os.path.exists(c['rendered_path'])]
          print(f'Ready clips on disk: {len(valid_queued)}')

          # Maintain buffer of ready clips
          if len(valid_queued) < 2:
              disc = ContentDiscovery(db=db)
              v = disc.discover_next_unprocessed_video()
              if v:
                  print(f'Discovered video: {v[\"title\"]} by {v.get(\"creator_name\")} ({v[\"url\"]})')
                  p = ClipperPipeline()
                  p.process_video(v[\"url\"], max_clips=4)
              else:
                  print('No new video found in this run.')
          "

          # 2. Publish next queued short to YouTube Shorts (1 every 15 mins)
          python -c "
          from storage.database import Database
          from uploader.youtube_studio import YouTubeStudioUploader
          import os

          db = Database()
          queued = [c for c in db.get_queued_clips(limit=20) if os.path.exists(c['rendered_path'])]
          today_count = db.get_todays_upload_count()
          print(f'Today uploads: {today_count}/96')

          if queued and today_count < 96 and os.getenv('YOUTUBE_SESSION_B64'):
              clip = queued[0]
              print(f'Publishing short #{today_count + 1}: {clip[\"title\"]}')
              uploader = YouTubeStudioUploader(headless=True)
              tags = [t.strip() for t in clip[\"tags\"].split(',') if t.strip()]
              res = uploader.upload_short(clip[\"rendered_path\"], clip[\"title\"], clip[\"description\"], tags, 'public')
              if res.get('status') == 'success':
                  db.mark_clip_published(clip['id'], res.get('url', ''))
                  print(f'Published successfully to YouTube! Total today: {today_count + 1}/96: {res.get(\"url\")}')
          else:
              print('No clips to publish, daily target reached, or YOUTUBE_SESSION_B64 secret not set.')
          "
